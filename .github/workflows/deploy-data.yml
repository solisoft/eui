# Verify, then deploy the demo application (examples/demo-app/) to
# eui-data.solisoft.net — the same server and the same contract as the
# documentation site, which is `deploy-site.yml` beside this file.
#
# The two differ in four places, and all four are why this is its own
# workflow rather than a matrix over that one:
#
#   1. This application has a **database**. `soli db:migrate up` runs on the
#      server before the slot is switched, so the new code never meets a
#      schema it does not know.
#   2. It **writes to its own tree** while it runs: attachments, thumbnails,
#      fetched album art. Those directories are in `.gitignore`, so a plain
#      `--delete-delay` would take them off the server on the first deploy.
#      They are excluded, which under rsync also protects them from deletion.
#   3. It carries an **EUI publisher key**. A client pins the public half on
#      first connection and refuses a different one afterwards (01 §2.2), so
#      deleting `config/eui_publisher.pkcs8` does not cost a re-pin — it
#      locks every existing user out until they clear their pin store. It is
#      excluded for the same reason `.env` is, and more urgently.
#   4. Its verification is a **boot**, not a formatter and a suite. The demo
#      is deliberately full of hand-written props the formatter would
#      reflow, and its suite wants a SoliDB that a runner does not have.
#      Booting it warms every handler in the tree, which is what catches a
#      parse error in a controller and a capability the server has never
#      heard of — the two ways this application has actually failed.
#
# See deploy/README.md for the one-time server setup.
name: verify & deploy the demo application

on:
  push:
    branches: [main]
    # The client is part of what these deploys ship: both build the
    # WebAssembly module and rsync it into the site. A change confined to
    # `crates/` or to the loader would otherwise sit in `main` looking
    # deployed while production served the previous module — which is how
    # the canvas-size fix spent a morning not reaching the page it fixed.
    paths:
      - "examples/demo-app/**"
      - "crates/**"
      - "assets/web/**"
      - "xtask-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-data.yml"
  workflow_dispatch:

# Two pushes close together must not cross in the middle of an rsync, and a
# deployment already running is never interrupted: that would leave the
# server holding half a tree.
concurrency:
  group: deploy-data
  cancel-in-progress: false

env:
  # The demo runs on a Soli of its own, installed by the deploy below into
  # <site>/.soli/<version>/ and named by app.infos — not the server's `soli`,
  # which the other sites on the box share and which stays where it is
  # (2.5.5 on 2026-10-17). 2.26.0 is the first release with `eui_score_layout`,
  # the native engraver: on 2.5.5 the score editor engraves in Soli, and
  # Beethoven's exposition took about 30 s to open, against 0.115 s on
  # 2.27.2 (every component but `broken` opens on 2.27.2; `pantry_5` fails
  # now and then on both, a pre-existing fault). Before 2026-10-17 this
  # pinned what the server's `soli` was:
  #
  # 2.5.5 is what eui-data.solisoft.net runs (the deploy of d66c4bc printed
  # "server: 2.5.5 — pinned: 2.3.3"), so it is what the checks below must
  # boot: 2.3.3 could no longer open the gallery at all, which does not know
  # the `level` event, and this job passed while testing a version nobody
  # deployed. Every component but `broken` opens on 2.5.5 (checked with
  # `snapshot` on 2026-09-27). Protocol 7 needs 2.6.1; until the server has
  # it, the landing page draws its badges the older way.
  #
  # 2.3.3 held this line before, as the first release whose `eui-proto` knows
  # the `scene` capability bit and node kind (EUI protocol 2): an older
  # server refuses this application at boot — `eui_capabilities: unknown
  # capability 'scene'`. Which is why the version is checked before the
  # switch rather than hoped for. 2.2.1 before that, for `nfc` and the
  # `location` and `nfc_tag` event kinds, for the same reason.
  SOLI_VERSION: "2.27.2"
  APP_DIR: examples/demo-app

jobs:
  verify:
    name: it boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The official install.sh only knows `latest`; the release tarball is
      # what a pinned version means.
      - name: Install soli (pinned version)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/solisoft/soli_lang/releases/download/v$SOLI_VERSION/soli-linux-amd64.tar.gz" \
            -o "$tmp/pkg.tar.gz"
          tar -xzf "$tmp/pkg.tar.gz" -C "$tmp"
          sudo install -m 0755 "$(find "$tmp" -type f -name soli -perm -u+x | head -1)" /usr/local/bin/soli
          rm -rf "$tmp"
          got="$(soli --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ "$got" = "$SOLI_VERSION" ] || { echo "soli $got installed, $SOLI_VERSION expected" >&2; exit 1; }
          echo "soli $got"

      # The routes file is where `eui_capabilities` lives, so this is the
      # cheapest thing that fails on a capability this soli does not know —
      # and it names the line. No database is touched.
      - name: The routes load
        working-directory: ${{ env.APP_DIR }}
        run: soli routes

      # `/live` offers a component and then opens a session for it by name.
      # A slug listed on the page with no `router_eui` beside it is a page
      # that loads, connects to nothing, and says only that a socket failed
      # — which is the least useful place to learn that a route was renamed.
      - name: Every component the live page offers has a session to open
        run: scripts/check-live-page.sh

      # Then the whole tree. `soli serve` warms every handler in every
      # controller and service before it answers anything, so a boot that
      # reaches a 200 on /up has parsed all of it. `/up` is Soli's own
      # readiness probe and needs no database — which matters, because a
      # runner has no SoliDB and this application has a schema.
      - name: It starts and says it is ready
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          soli serve . --port 8099 --strict-port > /tmp/boot.log 2>&1 &
          pid=$!
          code=000
          for i in $(seq 1 40); do
            sleep 2
            kill -0 "$pid" 2>/dev/null || break
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8099/up || echo 000)"
            [ "$code" = "200" ] && break
          done
          kill "$pid" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "" >&2
            echo "The application did not come up. What it said:" >&2
            tail -30 /tmp/boot.log >&2
            exit 1
          fi
          echo "/up -> 200; handlers warmed:"
          grep -m1 'warmed' /tmp/boot.log || true

  deploy:
    name: deploy eui-data.solisoft.net
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DATA_DOMAIN || 'eui-data.solisoft.net' }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER || 'rocky' }}
      SITES_DIR: ${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}
      # What `soli-proxy deploy|restart|logs -c` takes: the routing rules,
      # proxy.conf, never config.toml. Since soli-proxy 1.0 that file is
      # parsed strictly, so handing it config.toml fails the switch with
      # `cannot parse "[server]"`; config.toml is read from beside it.
      PROXY_CONF: ${{ vars.DEPLOY_PROXY_CONF || '/home/rocky/proxy.conf' }}
      DOMAIN: ${{ vars.DATA_DOMAIN || 'eui-data.solisoft.net' }}
      # The `name` declared in the server's app.infos, which soli-proxy uses
      # as the app's id.
      APP: ${{ vars.DATA_APP || 'eui-data' }}
      # The pids serving THIS site, and the /up probe on one of their ports.
      # The filter is an `if`, not `[ … ] && echo`: the server hosts a dozen
      # sites, the last `soli` inspected is almost never ours, and a false
      # `&&` at the end of the loop makes the `for` exit 1 — which, under
      # `set -e`, would take the whole step down with the right pids on stdout.
      PIDS: |
        for x in $(pgrep -x soli 2>/dev/null); do
          if [ "$(readlink /proc/$x/cwd 2>/dev/null)" = "${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}/${{ vars.DATA_DOMAIN || 'eui-data.solisoft.net' }}" ]; then
            echo $x
          fi
        done
      PROBE: |
        p=$(for x in $(pgrep -x soli 2>/dev/null); do
              if [ "$(readlink /proc/$x/cwd 2>/dev/null)" = "${{ vars.DEPLOY_SITES_DIR || '/home/rocky/sites' }}/${{ vars.DATA_DOMAIN || 'eui-data.solisoft.net' }}" ]; then
                tr "\0" "\n" < /proc/$x/cmdline | grep -A1 -- "--port" | tail -1
              fi
            done | sort -u | tail -1)
        [ -n "$p" ] || { echo 000; exit 0; }
        curl -s -o /dev/null -w "%{http_code}" -m 5 "http://127.0.0.1:$p/up"
    steps:
      - uses: actions/checkout@v4

      - name: Check the configuration
        run: |
          set -euo pipefail
          [ -n "$HOST" ]   || { echo "secret DEPLOY_HOST is missing" >&2; exit 1; }
          [ -n "$DOMAIN" ] || { echo "variable DATA_DOMAIN is missing (the site folder is <sites_dir>/<domain>)" >&2; exit 1; }
          case "$DOMAIN" in *.*) ;; *) echo "DATA_DOMAIN must contain a dot: $DOMAIN" >&2; exit 1 ;; esac
          echo "Target: $USER@$HOST:$SITES_DIR/$DOMAIN (from $APP_DIR/)"

      - name: Prepare SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # known_hosts rather than StrictHostKeyChecking=no: host verification
          # is not something to switch off on a channel carrying production code.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The site is created by hand once (app.infos + .env). This workflow
      # creates nothing on the server and touches no other folder.
      - name: Check the site exists on the server
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "test -f '$SITES_DIR/$DOMAIN/app.infos' && test -f '$SITES_DIR/$DOMAIN/.env'" \
            || { echo "$SITES_DIR/$DOMAIN must hold app.infos and .env — see deploy/README.md" >&2; exit 1; }

      # The site's own Soli, before anything is sent: the version the verify
      # job just booted, in <site>/.soli/<version>/, with `current` pointing
      # at it. Fetched once a version — a second deploy of the same pin finds
      # it and moves on — and from the same release tarball the runner used.
      # The server's own `soli` is not touched: other sites run on it.
      - name: Install the pinned Soli beside the site
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "bash -s" <<SH
          set -euo pipefail
          [ "\$(uname -m)" = x86_64 ] || { echo "the release tarball is linux-amd64; this server is \$(uname -m)" >&2; exit 1; }
          home='$SITES_DIR/$DOMAIN/.soli'
          dir="\$home/$SOLI_VERSION"
          if ! "\$dir/soli" --version 2>/dev/null | grep -qx "Soli $SOLI_VERSION"; then
            tmp="\$(mktemp -d)"
            curl -fsSL "https://github.com/solisoft/soli_lang/releases/download/v$SOLI_VERSION/soli-linux-amd64.tar.gz" -o "\$tmp/pkg.tar.gz"
            tar -xzf "\$tmp/pkg.tar.gz" -C "\$tmp"
            install -D -m 0755 "\$(find "\$tmp" -type f -name soli -perm -u+x | head -1)" "\$dir/soli"
            rm -rf "\$tmp"
          fi
          "\$dir/soli" --version
          ln -sfn "$SOLI_VERSION" "\$home/current"
          SH

      # app.infos is the server's file and this workflow never sends it, but
      # its `start_script` decides which `soli` the proxy runs. One that
      # still names the bare `soli` of the PATH is pointed at the site's own,
      # once, with the original kept beside it; one already pointing there is
      # left alone. The proxy watches the sites directory and reads it again.
      - name: Point app.infos at the site's Soli
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "bash -s" <<SH
          set -euo pipefail
          infos='$SITES_DIR/$DOMAIN/app.infos'
          own='$SITES_DIR/$DOMAIN/.soli/current/soli'
          if grep -q '^start_script = "soli ' "\$infos"; then
            cp -n "\$infos" "\$infos.before-own-soli"
            sed -i "s|^start_script = \"soli |start_script = \"\$own |" "\$infos"
            echo "app.infos now starts \$own (the original is app.infos.before-own-soli)"
          fi
          grep '^start_script' "\$infos"
          grep -q "^start_script = \"\$own " "\$infos" || { echo "app.infos does not start \$own; see deploy/README.md" >&2; exit 1; }
          SH

      # The browser client, built here because it is not committed.
      #
      # `/live` serves a canvas and then asks for `/eui/eui_web.js`; the
      # module is a seven-megabyte artefact that would be rebuilt on every
      # client change, so it is generated rather than tracked. Without this
      # step the page deploys and every reader presses a button that fetches
      # a 404 — which the embed reports honestly, and which is still a broken
      # feature in production. `xtask-web` writes it into
      # `examples/demo-app/public/eui/`, inside what the rsync below sends.
      - name: Install Rust for the browser client
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Pinned to what `Cargo.lock` resolved: the generator and the macro
      # must agree, or the module loads and then fails on its first call.
      # `binaryen` is `wasm-opt`, which is worth about 30% of the module.
      # Nothing else: `xtask-web` has no dependencies, so building the tool
      # that produces a WebAssembly module needs no system libraries at all.
      - name: Install wasm-bindgen and binaryen
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
          cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Build the browser client
        run: cargo run -p xtask-web

      - name: The live page has a client to load
        run: |
          set -euo pipefail
          for f in eui_web.js eui_web_bg.wasm eui-embed.js manifest.json; do
            [ -s "examples/demo-app/public/eui/$f" ] \
              || { echo "xtask-web did not write $f" >&2; exit 1; }
          done
          ls -l examples/demo-app/public/eui/

      # --delete-delay: what leaves the repository leaves the server. The
      # exclusions are the whole safety of that sentence here, because this
      # application writes into its own tree and none of it is committed:
      #
      #   config/eui_publisher.pkcs8  the key clients have pinned (01 §2.2).
      #                               Deleting it locks every existing user
      #                               out, not merely re-pins them.
      #   public/chat/                what people attached, and the
      #                               thumbnails made from it
      #   tmp/                        where an upload lands before the
      #                               application decides to keep it (01 §6)
      #   public/covers|x|tracker/    fetched or generated at runtime
      #
      # rsync does not delete what it excludes, so naming them here is what
      # keeps them.
      - name: Sync the files
        run: |
          set -euo pipefail
          rsync -rlzv --delete-delay --delay-updates \
            --exclude='.git/' \
            --exclude='.claude/' \
            --exclude='coverage/' \
            --exclude='tmp/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='app.infos' \
            --exclude='restart.txt' \
            --exclude='.soli/' \
            --exclude='config/eui_publisher.pkcs8' \
            --exclude='public/chat/' \
            --exclude='public/covers/' \
            --exclude='public/x/' \
            --exclude='public/tracker/' \
            "$APP_DIR/" "$USER@$HOST:$SITES_DIR/$DOMAIN/"

      # After the files and before the switch: the new code is on disk, the
      # old slot is still serving, and a migration that fails here fails with
      # the site still up. Seeding is *not* here — it is a one-time step by
      # hand (deploy/README.md), because re-running it on every deploy would
      # rewrite a room people have been talking in.
      - name: Migrate
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" "cd '$SITES_DIR/$DOMAIN' && .soli/current/soli db:migrate up"

      # `soli-proxy deploy` rather than `touch restart.txt`: the trigger file
      # is ignored in silence when the proxy cannot start the slot — an
      # orphaned process still holding the port, say — and the deployment goes
      # green with the old code still serving. The command returns a status
      # and a reason.
      - name: Switch the blue-green slot
        run: |
          set -euo pipefail
          before="$(ssh "$USER@$HOST" "$PIDS")"
          echo "processes before: ${before:-none}"
          echo "$before" > /tmp/pids-before

          if ! ssh "$USER@$HOST" "soli-proxy deploy -c '$PROXY_CONF' '$APP' 2>&1"; then
            echo "" >&2
            echo "The switch failed. Common cause: an orphaned slot still holds" >&2
            echo "its port, so the proxy cannot start a new one." >&2
            echo "  ssh $USER@$HOST 'soli-proxy logs -c $PROXY_CONF $APP'" >&2
            exit 1
          fi

      # The check is on a NEW process: a 200 from the old slot would only
      # prove the site answers, not that it answers with what was just pushed.
      - name: Check the new slot answers
        run: |
          set -euo pipefail
          before="$(cat /tmp/pids-before)"
          for i in $(seq 1 30); do
            sleep 3
            now="$(ssh "$USER@$HOST" "$PIDS")"
            fresh="$(comm -13 <(echo "$before" | sort) <(echo "$now" | sort) | tr -d ' ')"
            if [ -n "$fresh" ]; then
              code="$(ssh "$USER@$HOST" "$PROBE" 2>/dev/null | tail -1 || echo 000)"
              echo "attempt $i: new process $fresh, /up -> $code"
              if [ "$code" = "200" ]; then
                # Which binary the slot really is: the point of the site's own
                # Soli is lost if the proxy still started the PATH's.
                exe="$(ssh "$USER@$HOST" "for p in $fresh; do readlink /proc/\$p/exe; done" | sort -u)"
                echo "the new slot runs: $exe"
                case "$exe" in
                  *"/.soli/$SOLI_VERSION/soli") echo "The new slot answers, on Soli $SOLI_VERSION."; exit 0 ;;
                  *) echo "The new slot is not the site's Soli $SOLI_VERSION: $exe" >&2; exit 1 ;;
                esac
              fi
            else
              echo "attempt $i: no fresh process"
            fi
          done
          echo "" >&2
          echo "No new slot answered 200 on /up within 90 s." >&2
          echo "  ssh $USER@$HOST 'soli-proxy logs -c $PROXY_CONF $APP'" >&2
          exit 1

      # After a switch the proxy still balances across BOTH slot ports while
      # only one process is up: every other request hits a dead port and gets
      # a 421. `restart` brings both slots up on the current code.
      - name: Bring both slots up
        run: ssh "$USER@$HOST" "soli-proxy restart -c '$PROXY_CONF' '$APP'"

      # Every process serving the site, not only the fresh one, on the
      # site's Soli. The first deploy that moved the demo onto its own Soli
      # left one of the two slots on the server's 2.5.5: the switch started
      # the new binary, the restart did not replace the old process, and the
      # proxy balanced between them — the score editor opened Beethoven in
      # 0.8 s on one and 21 s on the other. A stale slot is switched out once
      # more; one still there after that fails the deploy.
      - name: Every slot runs the site's Soli
        run: |
          set -euo pipefail
          stale() {
            pids="$(ssh "$USER@$HOST" "$PIDS")"
            ssh "$USER@$HOST" "for p in $pids; do printf '%s %s\n' \$p \"\$(readlink /proc/\$p/exe)\"; done" \
              | grep -v "/.soli/$SOLI_VERSION/soli\$" || true
          }
          for round in 1 2; do
            left="$(stale)"
            if [ -z "$left" ]; then
              echo "Every slot runs $SITES_DIR/$DOMAIN/.soli/$SOLI_VERSION/soli:"
              ssh "$USER@$HOST" "$PIDS" | tr '\n' ' '; echo
              exit 0
            fi
            echo "round $round, not on the site's Soli $SOLI_VERSION:"; echo "$left"
            ssh "$USER@$HOST" "soli-proxy deploy -c '$PROXY_CONF' '$APP' 2>&1"
            sleep 15
            ssh "$USER@$HOST" "soli-proxy restart -c '$PROXY_CONF' '$APP'"
            sleep 15
          done
          left="$(stale)"
          [ -z "$left" ] && { echo "Every slot runs the site's Soli $SOLI_VERSION."; exit 0; }
          echo "Still serving on another binary after two switches:" >&2; echo "$left" >&2
          echo "  ssh $USER@$HOST 'soli-proxy logs -c $PROXY_CONF $APP'" >&2
          exit 1

      # End to end, through the proxy, with the real hostname — where the 421
      # shows. The /up probe on the app's own port bypasses exactly the part
      # that fails.
      - name: Check the service through the proxy
        run: |
          set -euo pipefail
          want=12
          probe="for i in \$(seq 1 $want); do curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1' -o /dev/null -w '%{http_code} ' 'https://$DOMAIN/up'; done"
          # Count the 200s, do not count the rest: the probe separates its
          # codes with a space, including after the last one, so `tr ' ' '\n'`
          # yields one empty line more. Counted as "not 200", it made the
          # check fail with twelve 200s out of twelve.
          for attempt in 1 2 3 4 5; do
            sleep 4
            codes="$(ssh "$USER@$HOST" "$probe" 2>/dev/null || true)"
            ok="$(printf '%s' "$codes" | tr ' ' '\n' | grep -c '^200$' || true)"
            echo "attempt $attempt: $codes(${ok:-0}/$want at 200)"
            [ "${ok:-0}" -eq "$want" ] && { echo "$want requests out of $want at 200."; exit 0; }
          done
          echo "" >&2
          echo "The site does not answer reliably through the proxy." >&2
          echo "A dead slot is still taking traffic; restart it:" >&2
          echo "  ssh $USER@$HOST 'soli-proxy restart -c $PROXY_CONF $APP'" >&2
          exit 1

      # The one thing that can rot here without anything else failing. A
      # client asks for this before a byte of the session is trusted, and it
      # is signed with a key the client pinned: if the key went missing and
      # was regenerated, this still answers 200 and every existing user is
      # locked out. So the fingerprint is printed, not just the status —
      # compare it to the one from the deploy before if a user reports being
      # refused (01 §2.1, 02 §7).
      - name: Check the EUI manifest is served, and say which key signed it
        run: |
          set -euo pipefail
          fetch="curl -sk -m 8 --resolve '$DOMAIN:443:127.0.0.1'"
          code="$(ssh "$USER@$HOST" "$fetch -o /dev/null -w '%{http_code}' 'https://$DOMAIN/.well-known/eui'")"
          echo "/.well-known/eui -> $code"
          [ "$code" = "200" ] || { echo "The EUI manifest is not being served; no client can open this application." >&2; exit 1; }
          sum="$(ssh "$USER@$HOST" "$fetch 'https://$DOMAIN/.well-known/eui' | sha256sum | cut -c1-16")"
          echo "manifest sha256 (first 16): $sum"
