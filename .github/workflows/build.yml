name: Build EUI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting is the one check that needs no toolchain beyond rustfmt and no
  # platform at all, so it runs on Linux and reports in under a minute —
  # ahead of the macOS runners, which queue for ten on a busy day.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustfmt.toml at the root says what "formatted" means; this only asks
      # whether the tree already is. `cargo xtask conform` runs the same
      # check first, so it fails here only if that was skipped.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  build-matrix:
    name: Build EUI Client
    runs-on: ${{ matrix.os }}
    # One platform failing should not hide what the others would have said:
    # a Windows link error and a macOS lint are different bugs, and waiting
    # a round trip to see the second one costs a queued macOS runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: linux
            exe: eui
          # Apple Silicon only. Intel macOS is not a supported target.
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
            platform: macos
            exe: eui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            platform: windows
            exe: eui.exe
    steps:
      - uses: actions/checkout@v4

      # What the client links against on Linux and nowhere else: ALSA for
      # the audio device, xkbcommon and Wayland for winit. Vulkan is loaded
      # at run time, so the GPU needs nothing here.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update Rust and toolchain
        run: rustup update stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        shell: bash
        run: |
          echo "Building for target: ${{ matrix.target }}"
          cargo build --release -p eui-client --target ${{ matrix.target }} -v
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/${{ matrix.exe }}"
          ls -lh dist/

      - name: Wrap in a .app bundle, with a DMG beside it
        if: matrix.platform == 'macos'
        run: |
          mv dist/eui dist/eui-${{ matrix.arch }}-macos
          ./scripts/wrap-macos-app.sh dist/eui-${{ matrix.arch }}-macos EUI com.soli.eui dist

      # One archive per platform, named for what is in it. Windows gets a
      # zip because that is what a Windows machine can open without being
      # told how.
      - name: Archive the bare binary
        shell: bash
        run: |
          cd dist
          case "${{ matrix.platform }}" in
            macos)
              tar -czf "eui-${{ matrix.arch }}-macos.tar.gz" "eui-${{ matrix.arch }}-macos" ;;
            linux)
              mv eui "eui-${{ matrix.arch }}-linux"
              tar -czf "eui-${{ matrix.arch }}-linux.tar.gz" "eui-${{ matrix.arch }}-linux" ;;
            windows)
              mv eui.exe "eui-${{ matrix.arch }}-windows.exe"
              7z a "eui-${{ matrix.arch }}-windows.zip" "eui-${{ matrix.arch }}-windows.exe" ;;
          esac
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eui-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/eui-*.tar.gz
            dist/eui-*-windows.zip
            dist/EUI*.dmg
            dist/EUI*.zip
          retention-days: 30

  # The two phones, built so somebody can put them on a device. Neither is
  # covered by `build-matrix`: an APK is not a binary and an iOS .app is not
  # a binary either, and both want a toolchain the desktop jobs do not.
  #
  # They do not gate the run. Nothing here has met a device yet, and a
  # packaging job that goes red on an SDK that moved would stop the client's
  # own build from reporting — which is the thing people actually read.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-apk-${{ hashFiles('**/Cargo.lock') }}

      # The runner ships the SDK and an NDK; `cargo apk` wants to be told
      # where the NDK is by name rather than finding it.
      - name: Point at the NDK
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # No `EUI_ANDROID_URL`: a CI build opens the shell, so whoever installs
      # it can type an address at whatever server they are running. A build
      # for one server is a thing to make deliberately, with the URL set.
      - name: Build the APK
        run: ./scripts/make-android-apk.sh dist

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: eui-android-apk
          path: dist/eui.apk
          retention-days: 30

  build-ios:
    name: Build iOS app
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-app-${{ hashFiles('**/Cargo.lock') }}

      # The simulator build is the one anybody can run: no account, no
      # profile, no device. `xcrun simctl install booted EUI.app`.
      - name: Build the simulator app
        run: ./scripts/make-ios-app.sh sim dist/sim

      # And the device build, unsigned, because this runner has no identity
      # to sign with. It is still worth having: Xcode or `ios-deploy` will
      # sign it on the way to a phone.
      - name: Build the device app, unsigned
        run: ./scripts/make-ios-app.sh device dist/device

      # A .app is a directory and a release asset is a file, so both are
      # zipped here rather than left for whoever downloads them.
      - name: Archive the apps
        run: |
          (cd dist/sim && zip -qry ../EUI-ios-simulator.zip EUI.app)
          (cd dist/device && zip -qry ../EUI-ios-device-unsigned.zip EUI.app)

      - name: Upload the apps
        uses: actions/upload-artifact@v4
        with:
          name: eui-ios-app
          path: dist/*.zip
          retention-days: 30

  build-vitrine:
    name: Build Vitrine
    runs-on: macos-14
    steps:
      # Both repos are checked out as siblings, neither inside the other.
      # This one is a cargo workspace, so a second workspace nested under it
      # makes cargo insist the inner crate be a member of the outer.
      - uses: actions/checkout@v4
        with:
          path: eui

      # `soli desktop build` is the thing that packages Vitrine, and it lives
      # in the language repo, not this one.
      - name: Check out soli_lang
        uses: actions/checkout@v4
        with:
          repository: solisoft/soli_lang
          path: lang

      # There is no unencrypted desktop build, so this artifact is encrypted
      # whether or not it has anything to hide — and it then needs that same
      # key at every launch or it will not start. Vitrine is a demo, so the
      # key is minted here, used to seal the artifact, and shipped inside it.
      #
      # It is deliberately NOT the repository secret. That one also unlocks a
      # real installation, and baking it into a downloadable app would
      # publish it.
      - name: Mint a throwaway key for this build
        run: echo "BUNDLE_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lang/target
          key: ${{ runner.os }}-vitrine-${{ hashFiles('lang/Cargo.lock') }}

      # The binary itself, keyed by everything it is built from: the exact
      # soli_lang commit, its lock file, and the two crates of this repo
      # that are patched into it. The cargo cache above only makes a rebuild
      # incremental; `solilang` is one crate of ten minutes, and it is
      # rebuilt whenever eui-proto or eui-client changed — nearly every
      # push. When nothing in that key moved, there is nothing to build,
      # and this step says so.
      - name: Which soli_lang this is
        id: lang
        run: echo "sha=$(git -C lang rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the built soli
        id: soli
        uses: actions/cache@v4
        with:
          path: lang/target/release/soli
          key: ${{ runner.os }}-soli-eui-desktop-${{ steps.lang.outputs.sha }}-${{ hashFiles('lang/Cargo.lock', 'eui/crates/eui-proto/**', 'eui/crates/eui-client/**', 'eui/crates/eui-tree/**', 'eui/crates/eui-theme/**', 'eui/crates/eui-layout/**', 'eui/crates/eui-text/**', 'eui/crates/eui-render/**', 'eui/crates/eui-vm/**', 'eui/crates/eui-audio/**', 'eui/crates/eui-video/**') }}

      # Only the eui-desktop feature is needed, and leaving the defaults off
      # is what keeps this build around ten minutes instead of twenty-five.
      # soli_lang pins eui by git revision, so without this the artifact is
      # built against whatever that pin says and no change in this repo can
      # ever reach it — including a fix for a crash the artifact is showing.
      # The patch points those two crates at the checkout beside us.
      - name: Build soli with eui-desktop, against this checkout
        if: steps.soli.outputs.cache-hit != 'true'
        working-directory: lang
        run: |
          cargo build --release --no-default-features --features eui-desktop \
            --config 'patch."https://github.com/solisoft/eui".eui-proto.path="${{ github.workspace }}/eui/crates/eui-proto"' \
            --config 'patch."https://github.com/solisoft/eui".eui-client.path="${{ github.workspace }}/eui/crates/eui-client"'

      - name: Package Vitrine
        env:
          SOLI_BUNDLE_KEY: ${{ env.BUNDLE_KEY }}
        run: |
          mkdir -p dist
          ./lang/target/release/soli desktop build eui/examples/demo-app \
            --app-id com.soli.vitrine \
            --name Vitrine \
            --eui gallery \
            --no-db \
            --output dist/vitrine-desktop
          ls -lh dist/vitrine-desktop

      # The same key goes beside the executable, or the app cannot unlock
      # itself at launch and exits before drawing anything.
      - name: Wrap in a .app bundle, with a DMG beside it
        env:
          BUNDLE_KEY: ${{ env.BUNDLE_KEY }}
        run: ./eui/scripts/wrap-macos-app.sh dist/vitrine-desktop Vitrine com.soli.vitrine dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-macos-aarch64
          path: |
            dist/Vitrine*.dmg
            dist/Vitrine*.zip
          retention-days: 30

  # Between tags there was nowhere to send anybody: the files existed, on the
  # run, behind a GitHub login and four clicks. So every push to `main`
  # replaces one rolling prerelease, and the download links in the README
  # point at it and never move.
  #
  # A *prerelease*, deliberately: `/releases/latest` goes on meaning the last
  # tagged version, and this is plainly the tip of `main` rather than
  # something anybody promised.
  #
  # The old one is deleted rather than updated, because a rolling tag has to
  # move with the branch and `action-gh-release` will not move a tag that
  # already exists — it would leave the release pointing at the commit it was
  # first made from, which is worse than no release at all.
  publish-rolling:
    name: Publish the rolling build
    needs: [build-matrix, build-vitrine, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Clear the last rolling build
        run: gh release delete rolling --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling build
          # Which commit this is, because a window cannot otherwise be told
          # from one built an hour earlier — the same reason the client
          # carries its own short sha in its title.
          body: |
            The tip of `main`, built by CI. Replaced on every push, so the
            links below always point at the newest one.

            Commit `${{ github.sha }}`.

            Phone builds have not been run on a device by anyone. The APK is
            debug-signed and installs with `adb install -r eui.apk`; the iOS
            simulator build needs no signing; the iOS device build is
            unsigned and wants an identity on the way to a phone.
          prerelease: true
          files: |
            eui-*/*.tar.gz
            eui-*/*.zip
            eui-*/*.dmg
            eui-android-apk/*.apk
            eui-ios-app/*.zip
            vitrine-macos-*/*.dmg
            vitrine-macos-*/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release (on tag push)
    # The phone jobs are `continue-on-error`, so a packaging break cannot
    # keep a release from happening; it just means that file is not in it.
    needs: [build-matrix, build-vitrine, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eui-*/*.tar.gz
            eui-*/*.zip
            eui-*/*.dmg
            eui-android-apk/*.apk
            eui-ios-app/*.zip
            vitrine-macos-*/*.dmg
            vitrine-macos-*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The worker dies of SIGSYS on this runner and not on a developer's
      # machine: seccomp is refusing a system call the 36-entry allow-list
      # does not have, and the Landlock line says the kernel here is older.
      # Logging instead of killing names the call; `|| true` keeps the
      # diagnosis out of the pass/fail.
      - name: Which system call the sandbox refuses here
        if: runner.os == 'Linux'
        run: |
          uname -a
          # A seccomp kill is an audit event, and an audit event needs
          # something listening — which is what the strace attempt was
          # working around, and why it found nothing: under ptrace an
          # interrupted call is resumed by the tracer's own path, so the
          # kill stops happening at all. Give the kernel a listener
          # instead and it names the call itself. `-i` turns the number
          # into a name; `|| true` keeps the diagnosis out of pass/fail.
          sudo apt-get install -y --no-install-recommends auditd
          sudo service auditd start || sudo systemctl start auditd || true
          sudo auditctl -e 1 || true
          cargo test --release -p eui-client --test worker || true
          echo '--- what the kernel refused ---'
          sudo ausearch -m SECCOMP -i 2>/dev/null | tail -40 || true
          sudo grep -h "type=SECCOMP" /var/log/audit/audit.log 2>/dev/null | tail -20 || true
          sudo dmesg 2>/dev/null | grep -i -E "seccomp|audit" | tail -20 || true

      # No GPU on a hosted runner, so the pixel tests skip themselves —
      # they say so and return rather than failing.
      - name: Run tests
        run: cargo test --release --verbose

      # Each platform lints its own cfg'd code: the Linux-only sandbox is
      # dead code on the other two, and clippy is what says so.
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
