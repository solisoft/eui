name: Build macOS Demo Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-matrix:
    name: Build EUI Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Intel macOS
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
          # Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update Rust and toolchain
        run: rustup update stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          echo "Building for target: ${{ matrix.target }}"
          cargo build --release -p eui-client --target ${{ matrix.target }} -v
          mkdir -p dist
          cp target/${{ matrix.target }}/release/eui dist/eui-${{ matrix.arch }}-macos
          ls -lh dist/eui-${{ matrix.arch }}-macos

      - name: Create app bundle (macOS app structure)
        run: |
          # Create the app bundle structure
          APP_DIR="dist/EUI-Demo.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          # Copy the binary
          BINARY_PATH="dist/eui-${{ matrix.arch }}-macos"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            ls -la dist/
            exit 1
          fi
          cp "$BINARY_PATH" "$APP_DIR/MacOS/eui"
          chmod +x "$APP_DIR/MacOS/eui"
          echo "Binary copied and made executable"

          # Create Info.plist
          cat > "$APP_DIR/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>eui</string>
              <key>CFBundleIdentifier</key>
              <string>com.soli.eui-demo</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>EUI Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Create a PkgInfo file
          echo -n "APPL????" > "$APP_DIR/PkgInfo"

      - name: Create DMG (macOS installer)
        run: |
          cd dist
          # Create a temporary folder for DMG contents
          mkdir -p dmg-temp
          cp -r EUI-Demo.app dmg-temp/

          # Create the DMG
          hdiutil create -volname "EUI Demo" \
                        -srcfolder dmg-temp \
                        -ov -format UDZO \
                        "EUI-Demo-${{ matrix.arch }}-macos.dmg"
          rm -rf dmg-temp

      - name: Create binary archive
        run: |
          cd dist
          tar -czf "eui-${{ matrix.arch }}-macos.tar.gz" "eui-${{ matrix.arch }}-macos"
          zip -r "EUI-Demo-${{ matrix.arch }}-macos.zip" "EUI-Demo.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eui-macos-${{ matrix.arch }}
          path: |
            dist/eui-*.tar.gz
            dist/EUI-Demo*.dmg
            dist/EUI-Demo*.zip
          retention-days: 30

  create-release:
    name: Create Release (on tag push)
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eui-macos-*/*.tar.gz
            eui-macos-*/*.dmg
            eui-macos-*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
