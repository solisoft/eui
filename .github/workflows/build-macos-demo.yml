name: Build macOS Demo Apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting is the one check that needs no toolchain beyond rustfmt and no
  # platform at all, so it runs on Linux and reports in under a minute —
  # ahead of the macOS runners, which queue for ten on a busy day.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustfmt.toml at the root says what "formatted" means; this only asks
      # whether the tree already is. `cargo xtask conform` runs the same
      # check first, so it fails here only if that was skipped.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  build-matrix:
    name: Build EUI Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Apple Silicon only. Intel macOS is not a supported target.
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update Rust and toolchain
        run: rustup update stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          echo "Building for target: ${{ matrix.target }}"
          cargo build --release -p eui-client --target ${{ matrix.target }} -v
          mkdir -p dist
          cp target/${{ matrix.target }}/release/eui dist/eui-${{ matrix.arch }}-macos
          ls -lh dist/eui-${{ matrix.arch }}-macos

      - name: Wrap in a .app bundle, with a DMG beside it
        run: ./scripts/wrap-macos-app.sh dist/eui-${{ matrix.arch }}-macos EUI-Demo com.soli.eui-demo dist

      - name: Archive the bare binary
        run: cd dist && tar -czf "eui-${{ matrix.arch }}-macos.tar.gz" "eui-${{ matrix.arch }}-macos"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eui-macos-${{ matrix.arch }}
          path: |
            dist/eui-*.tar.gz
            dist/EUI-Demo*.dmg
            dist/EUI-Demo*.zip
          retention-days: 30

  build-vitrine:
    name: Build Vitrine
    runs-on: macos-14
    steps:
      # Both repos are checked out as siblings, neither inside the other.
      # This one is a cargo workspace, so a second workspace nested under it
      # makes cargo insist the inner crate be a member of the outer.
      - uses: actions/checkout@v4
        with:
          path: eui

      # `soli desktop build` is the thing that packages Vitrine, and it lives
      # in the language repo, not this one.
      - name: Check out soli_lang
        uses: actions/checkout@v4
        with:
          repository: solisoft/soli_lang
          path: lang

      # There is no unencrypted desktop build, so this artifact is encrypted
      # whether or not it has anything to hide — and it then needs that same
      # key at every launch or it will not start. Vitrine is a demo, so the
      # key is minted here, used to seal the artifact, and shipped inside it.
      #
      # It is deliberately NOT the repository secret. That one also unlocks a
      # real installation, and baking it into a downloadable app would
      # publish it.
      - name: Mint a throwaway key for this build
        run: echo "BUNDLE_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lang/target
          key: ${{ runner.os }}-vitrine-${{ hashFiles('lang/Cargo.lock') }}

      # Only the eui-desktop feature is needed, and leaving the defaults off
      # is what keeps this build around ten minutes instead of twenty-five.
      # soli_lang pins eui by git revision, so without this the artifact is
      # built against whatever that pin says and no change in this repo can
      # ever reach it — including a fix for a crash the artifact is showing.
      # The patch points those two crates at the checkout beside us.
      - name: Build soli with eui-desktop, against this checkout
        working-directory: lang
        run: |
          cargo build --release --no-default-features --features eui-desktop \
            --config 'patch."https://github.com/solisoft/eui".eui-proto.path="${{ github.workspace }}/eui/crates/eui-proto"' \
            --config 'patch."https://github.com/solisoft/eui".eui-client.path="${{ github.workspace }}/eui/crates/eui-client"'

      - name: Package Vitrine
        env:
          SOLI_BUNDLE_KEY: ${{ env.BUNDLE_KEY }}
        run: |
          mkdir -p dist
          ./lang/target/release/soli desktop build eui/examples/counter-app \
            --app-id com.soli.vitrine \
            --name Vitrine \
            --eui gallery \
            --no-db \
            --output dist/vitrine-desktop
          ls -lh dist/vitrine-desktop

      # The same key goes beside the executable, or the app cannot unlock
      # itself at launch and exits before drawing anything.
      - name: Wrap in a .app bundle, with a DMG beside it
        env:
          BUNDLE_KEY: ${{ env.BUNDLE_KEY }}
        run: ./eui/scripts/wrap-macos-app.sh dist/vitrine-desktop Vitrine com.soli.vitrine dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-macos-aarch64
          path: |
            dist/Vitrine*.dmg
            dist/Vitrine*.zip
          retention-days: 30

  create-release:
    name: Create Release (on tag push)
    needs: [build-matrix, build-vitrine]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eui-macos-*/*.tar.gz
            eui-macos-*/*.dmg
            eui-macos-*/*.zip
            vitrine-macos-*/*.dmg
            vitrine-macos-*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release --verbose

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
