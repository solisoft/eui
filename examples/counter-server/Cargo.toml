[package]
name = "counter-server"
description = "A minimal EUI server: the counter, over a loopback WebSocket, for the client to talk to before Soli speaks EUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "counter-server"
path = "src/main.rs"

[dependencies]
eui-proto = { path = "../../crates/eui-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true
