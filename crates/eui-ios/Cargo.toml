[package]
name = "eui-ios"
description = "The EUI client as an iOS application: the static library Xcode links, and the header it calls through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Two ways in, because there are two ways an iOS application gets built.
#
# The **binary** is the one to reach for: winit's `run_app` calls
# `UIApplicationMain` itself, so an ordinary `fn main` is a whole iOS
# application and `scripts/make-ios-app.sh` can wrap it in a `.app` with no
# Xcode project anywhere. That is what the dev install uses.
#
# The **static library** is for embedding in an Xcode project that already
# exists and owns its own `main`: it exports `eui_start` for that `main` to
# call. Both are built on every target, and on a desktop both compile to
# nothing, because their sources are behind `cfg(target_os = "ios")`.
[lib]
name = "eui_ios"
crate-type = ["staticlib"]

[[bin]]
name = "eui-ios"
path = "src/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
# The three parts with no UIKit behind them are left out by name rather than
# by accident: no file dialogs, no system clipboard, no accessibility
# adapter. Pictures stay.
eui-client = { path = "../eui-client", version = "0.1.0", default-features = false, features = ["jpeg", "webp"] }

[lints]
workspace = true
