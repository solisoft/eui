[package]
name = "eui-client"
description = "The EUI client: session driver, HTTPS/WSS transport, and the native window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "eui"
path = "src/main.rs"

[dependencies]
eui-cursor = { path = "../eui-cursor", version = "0.1.0" }
eui-proto = { path = "../eui-proto", version = "0.1.0" }
eui-tree = { path = "../eui-tree", version = "0.1.0" }
eui-theme = { path = "../eui-theme", version = "0.1.0" }
eui-layout = { path = "../eui-layout", version = "0.1.0" }
eui-text = { path = "../eui-text", version = "0.1.0" }
eui-render = { path = "../eui-render", version = "0.1.0" }
# The shader verifier. Linked here so the parse that meets a module a server
# chose happens in the confined worker (08 §10), beside the image decoders,
# and not in the window beside TLS.
eui-shader = { path = "../eui-shader", version = "0.1.0" }
eui-vm = { path = "../eui-vm", version = "0.1.0" }
eui-audio = { path = "../eui-audio", version = "0.1.0" }
eui-video = { path = "../eui-video", version = "0.1.0" }
winit = "0.30"
wgpu = "23"
# Reinterpreting a validated mesh as bytes across the worker pipe, and back.
bytemuck = "1"
blake3 = "1"
png = "0.17"
# JPEG and WebP, both pure Rust and both optional: see the `jpeg` and
# `webp` features.
zune-jpeg = { version = "0.5.15", optional = true }
image-webp = { version = "0.2.0", optional = true }

# The socket, the clock's trust store and the two devices — every one of them
# a thing the host does itself in a browser. A page is handed a WebSocket
# that has already done TLS, a `fetch` that has already checked the chain,
# and an audio graph it may not write samples into; so the crates that do
# those jobs here are not merely unused on `wasm32`, they do not build for
# it. `ring` compiles C, `cpal` and `notify` want a device and an inotify,
# and `tokio`'s reactor wants a poll. See `transport_web.rs` for the half
# that replaces them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
pollster = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
# Ed25519 for the manifest signature; already in the tree under rustls.
ring = "0.17"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
# Sound. The Android backend is `oboe`, which cpal picks for that target on
# its own; the audio device belongs to the window, like the GPU, and the
# worker cannot open one and must not (08 §10).
cpal = "0.15"

# Three parts that are a platform as much as a feature. Each rests on a
# crate with nothing behind it on a phone — no `rfd` backend for the Android
# or iOS file picker, no `arboard` for either clipboard, and no AccessKit
# adapter for TalkBack or VoiceOver — so they are declared for every target
# but those two, and `build.rs` turns the matching `has_*` cfg off there.
# See its `platform_parts`.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
# The platform's own trust store, so the client agrees with the machine it
# runs on: a development CA installed by `mkcert -install` is there, and
# every other client on that machine already honours it. A desktop only —
# neither phone keeps its authorities where this can read them.
rustls-native-certs = "0.8"
# Accessibility: the tree handed to AT-SPI, UIA and AX. Only wakes when an
# assistive technology asks; `--no-default-features` builds without it.
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }
# The system clipboard, for the person's own copy, cut and paste.
arboard = { version = "3", optional = true, default-features = false, features = ["wayland-data-control"] }
# The platform's own file dialogs, for spec 03 §3.2. On Linux this is the
# XDG portal rather than GTK, so a client in a sandbox asks the desktop for
# a file the way everything else does.
rfd = { version = "0.17.2", optional = true }

# A page. Nothing here is new to the lock file: `winit` and `wgpu` already
# resolve every one of these for this target, so naming them is the client
# agreeing with the two libraries it is built on rather than converting at
# every boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The window's own channel to the socket. Only `sync`: the far end of
# `Connection.tx` is a task on the page's one thread, and keeping the type
# identical is what leaves `app.rs` untouched. No reactor, no runtime.
tokio = { version = "1", default-features = false, features = ["sync"] }
# `Backends::GL` on this target is WebGL2, and it is not in wgpu's default
# set. Without it a browser with no WebGPU gets no adapter and draws
# nothing, which is a blank rectangle rather than an error.
# `webgl`: `Backends::GL` here is WebGL2, and it is not in wgpu's default
# set — without it a browser with no WebGPU gets no adapter and draws
# nothing. `fragile-send-sync-non-atomic-wasm`: wgpu's handles are `!Send`
# on this target, and `Wake` travels through winit's `Sender<T>`. The
# feature is named for a hazard that does not exist here — a page has one
# thread and wasm has no threads without `SharedArrayBuffer`, which this
# build does not use and whose headers the sites deliberately do not set.
wgpu = { version = "23", features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }
# `std::time::Instant` panics here; this is `performance.now()` behind
# `std`'s own names, and it is what winit's `ControlFlow::WaitUntil` takes.
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "console", "Location",
    "CustomEvent", "EventTarget",
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Event", "EventTarget",
    "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials",
    "Response", "Headers",
] }

# iOS. UIKit is asked exactly one question — how much of the window its soft
# keyboard is standing on — and it is asked from `eui-uikit` rather than
# here, because asking costs an `unsafe` block and this crate is
# `#![forbid(unsafe_code)]`. `ios.rs` does the safe half: it pulls the
# `UIView` out of the window handle and hands the pointer over.
[target.'cfg(target_os = "ios")'.dependencies]
eui-uikit = { path = "../eui-uikit", version = "0.1.0" }

# Android. `android-native-activity` is what makes winit's event loop take
# an `AndroidApp` instead of starting from `main`; the crate itself is here
# for the soft keyboard and the application's own data directory, neither of
# which the window can ask for through winit.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = "0.6"

[features]
default = ["a11y", "clipboard", "files", "jpeg", "webp"]
a11y = ["dep:accesskit", "dep:accesskit_winit"]
clipboard = ["dep:arboard"]
# The two other pictures the web has. PNG is always decoded; these are
# separable because they are bytes in the binary and 10 §1 counts them.
jpeg = ["dep:zune-jpeg"]
webp = ["dep:image-webp"]
files = ["dep:rfd"]

[dev-dependencies]
eui-render = { path = "../eui-render", version = "0.1.0" }
eui-theme = { path = "../eui-theme", version = "0.1.0" }
counter-server = { path = "../../examples/counter-server", version = "0.1.0" }
gif = "0.13"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The drop half of 03 §3.2, which winit's Wayland backend does not report.
# Its own crate because attaching to winit's `wl_display` needs `unsafe`,
# and this one is `#![forbid(unsafe_code)]`.
eui-wayland = { path = "../eui-wayland", version = "0.1.0" }
# The XDG desktop portal, for the one thing winit will not answer on this
# platform: whether the desktop is light or dark. `org.freedesktop.appearance`
# is where GNOME, KDE and the rest keep it, and it is what a browser answers
# `prefers-color-scheme` from. Nothing new in the lock file -- AccessKit's
# AT-SPI bridge already resolves zbus for this target, and this is the same
# crate with its blocking API turned on.
zbus = "5"
landlock = "0.4.7"
libc = "0.2.189"
rustix = { version = "1", features = ["process"] }
seccompiler = "0.5.0"

[target."cfg(unix)".dependencies]
signal-hook = { version = "0.3", default-features = false }
