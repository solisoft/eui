[package]
name = "eui-client"
description = "The EUI client: session driver, HTTPS/WSS transport, and the native window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "eui"
path = "src/main.rs"

[dependencies]
eui-proto = { path = "../eui-proto", version = "0.1.0" }
eui-tree = { path = "../eui-tree", version = "0.1.0" }
eui-theme = { path = "../eui-theme", version = "0.1.0" }
eui-layout = { path = "../eui-layout", version = "0.1.0" }
eui-text = { path = "../eui-text", version = "0.1.0" }
eui-render = { path = "../eui-render", version = "0.1.0" }
eui-vm = { path = "../eui-vm", version = "0.1.0" }
eui-audio = { path = "../eui-audio", version = "0.1.0" }
winit = "0.30"
wgpu = "23"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
pollster = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
blake3 = "1"
png = "0.17"
# Ed25519 for the manifest signature; already in the tree under rustls.
ring = "0.17"
# Accessibility: the tree handed to AT-SPI, UIA and AX. Only wakes when an
# assistive technology asks; `--no-default-features` builds without it.
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }

# The system clipboard, for the person's own copy, cut and paste.
arboard = { version = "3", optional = true, default-features = false, features = ["wayland-data-control"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
cpal = "0.15"
# The audio device belongs to the window, like the GPU: the worker cannot
# open one, and must not (08 §10).

[features]
default = ["a11y", "clipboard"]
a11y = ["dep:accesskit", "dep:accesskit_winit"]
clipboard = ["dep:arboard"]

[dev-dependencies]
eui-render = { path = "../eui-render", version = "0.1.0" }
eui-theme = { path = "../eui-theme", version = "0.1.0" }
counter-server = { path = "../../examples/counter-server", version = "0.1.0" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.189"
rustix = { version = "1", features = ["process"] }
seccompiler = "0.5.0"

[target."cfg(unix)".dependencies]
signal-hook = { version = "0.3", default-features = false }
