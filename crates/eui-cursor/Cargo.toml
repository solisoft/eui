[package]
name = "eui-cursor"
description = "The one question the client puts to the platform during a drag: where the pointer is, which winit reports a dropped file without."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# AppKit, for `mouseLocationOutsideOfEventStream`. The same objc2 winit
# uses, so no second version of it enters the graph.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSGeometry"] }

# `GetCursorPos` and `ScreenToClient`. Again winit's version.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
