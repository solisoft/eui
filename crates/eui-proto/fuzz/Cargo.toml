[package]
name = "eui-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eui-proto = { path = ".." }
eui-tree = { path = "../../eui-tree" }
eui-theme = { path = "../../eui-theme" }
eui-layout = { path = "../../eui-layout" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false

[[bin]]
name = "session_apply"
path = "fuzz_targets/session_apply.rs"
test = false
doc = false

[[bin]]
name = "theme_decode"
path = "fuzz_targets/theme_decode.rs"
test = false
doc = false

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false

# Its own workspace, as eui-shader's fuzz crate is: it sits inside the
# repository's without being a member, and cargo refuses to build a package
# that believes it is in a workspace that does not list it. Every run of the
# fuzz job failed on that from 2026-09-21 until this line.
[workspace]
members = ["."]
