# cargo-deny policy. Run: cargo deny check
#
# The wire crate has no dependencies at all; the rest of the client pulls in
# wgpu, winit, cosmic-text and a TLS stack. Every one of those is a supply
# chain, and this file is where that is acknowledged rather than ignored.

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained (RUSTSEC-2026-0192). It reaches us through
    # cosmic-text and swash, which have not moved off it yet. Font parsing is
    # exactly the kind of code an advisory matters for, so this is a tracked
    # exception, not a dismissal: revisit whenever cosmic-text releases.
    "RUSTSEC-2026-0192",
    # rustybuzz (RUSTSEC-2026-0206), the shaper under cosmic-text, and paste
    # (RUSTSEC-2024-0436), a proc-macro helper under wgpu's dependency tree:
    # both "unmaintained", neither with a known vulnerability. Tracked here
    # for the same reason as above — the exception is visible, and it is
    # reviewed when the upstream crates move.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
