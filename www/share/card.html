<!doctype html>
<!--
  The picture a link to the site unfurls into: 1200 × 630, the size every
  large-card preview (Open Graph, X, LinkedIn, Slack, Discord) crops to.
  Rendered to public/images/share/eui.png by scripts/make-share-card.sh;
  edit this, run that, commit both.

  The client at work rather than a description of it: the demo application's
  Meridian dashboard, the real render the demo page already shows
  (public/images/demo/gallery-light.png), in a client window turned towards
  the reader. The window's bar says what a client is given — a session
  address, not a page — and the thesis sits beside it in the site's own hand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #f4f6f3;
        --ink: #12171b;
        --ink-soft: #4b565e;
        --rule-faint: #dde3e5;
        --blue: #1f35d6;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        /* The drawing sheet: a faint 30 px grid, as the site's rules are. */
        background-image:
            linear-gradient(var(--rule-faint) 1px, transparent 1px),
            linear-gradient(90deg, var(--rule-faint) 1px, transparent 1px);
        background-size: 30px 30px;
        background-position: -1px -1px;
    }
    .copy { position: absolute; z-index: 2; left: 64px; top: 64px; width: 430px; }
    .mark { font-family: var(--mono); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); display: flex; align-items: baseline; gap: 14px; }
    .mark b { color: var(--blue); font-weight: 500; font-size: 28px; letter-spacing: 0.06em; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: 66px; line-height: 1.0; letter-spacing: -0.01em; margin-top: 22px; }
    h1 em { font-style: italic; color: var(--blue); }
    .claim { margin-top: 18px; font-size: 20px; line-height: 1.42; color: var(--ink-soft); }
    .url { position: absolute; z-index: 2; left: 64px; bottom: 48px; font-family: var(--mono); font-size: 14px; letter-spacing: 0.08em; color: var(--ink); font-weight: 500; }

    /* A client window: no browser, so no tabs and no address bar. */
    .win {
        position: absolute; width: 900px; left: 520px; top: 70px;
        background: #fff; border: 1px solid rgba(18, 23, 27, 0.18); border-radius: 10px; overflow: hidden;
        box-shadow: 0 30px 60px -20px rgba(18, 23, 27, 0.35), 0 12px 24px -12px rgba(18, 23, 27, 0.25);
        transform: perspective(2000px) rotateY(-22deg) rotateX(8deg) rotateZ(1deg);
        transform-origin: left center;
    }
    .bar {
        height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
        background: #eef1f2; border-bottom: 1px solid rgba(18, 23, 27, 0.12);
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); white-space: nowrap;
    }
    .bar i { width: 9px; height: 9px; border-radius: 50%; background: #c3ccd1; flex: none; }
    .win img { display: block; width: 100%; }
</style>
</head>
<body>
    <div class="copy">
        <div class="mark"><b>EUI</b><span>no HTML · no CSS · no JS</span></div>
        <h1>An interface is not a document. <em>Stop sending one.</em></h1>
        <p class="claim">The server sends a resolved tree; a native Rust client draws it on the GPU. This dashboard is that client.</p>
    </div>
    <div class="url">eui.solisoft.net</div>
    <div class="win">
        <div class="bar"><i></i><span>eui · wss://eui.solisoft.net/_eui/session/gallery</span></div>
        <img src="../public/images/demo/gallery-light.png" alt="">
    </div>
</body>
</html>
